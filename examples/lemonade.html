    <main>
      <h1>Lemonade for two</h1>
      <h2 id="ingredients">Ingredients</h2>
      <ul>
        <li>¼ cup lemon juice</li>
        <li>2 tablespoons sugar</li>
        <li>2 cups cold water</li>
      </ul>
      <h2 id="method">Method</h2>
      <ol>
        <li>Stir the lemon juice and sugar in a jug until the sugar dissolves.</li>
        <li>Pour in the cold water and stir.</li>
        <li>Divide the lemonade between two glasses.</li>
      </ol>
    </main>
